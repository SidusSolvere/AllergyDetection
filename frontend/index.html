<!DOCTYPE html>
<html>

<head>
  <title>Allergy Detection</title>
</head>

<body>

  <h1>Upload a Photo</h1>

  <input type="file" id="fileInput" accept="image/*">
  <button onclick="upload()">Check</button>

  <div id="result"></div>

  <script>
    const API = "http://127.0.0.1:8000";

    async function upload() {
      const file = document.getElementById("fileInput").files[0];

      if (!file) {
        alert("Please select an image.");
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      document.getElementById("result").innerHTML = "<p>Analyzing...</p>";

      try {
        const res = await fetch(`${API}/predict`, {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        document.getElementById("result").innerHTML = `
                    <h2>Prediction Result</h2>

                    <p><strong>Result:</strong> ${data.result}</p>

                    <p><strong>Severity Score:</strong> ${data.severity}</p>

                    <p><strong>Severity Percentage:</strong> ${data.severity_percentage}%</p>

                    <hr>

                    <h3>AI Advice</h3>

                    <p>${data.advice.explanation}</p>

                    <h4>Care Tips</h4>

                    <ul>
                        ${data.advice.care_tips
            .map(tip => `<li>${tip}</li>`)
            .join("")}
                    </ul>

                    <p>
                        <strong>Doctor Recommendation:</strong>
                        ${data.advice.see_doctor
            ? "Yes, consult a doctor."
            : "Home care should be sufficient."}
                    </p>
                `;
      } catch (err) {
        document.getElementById("result").innerHTML =
          `<p style="color:red;">Error: ${err.message}</p>`;
      }
    }
  </script>

</body>

</html>
